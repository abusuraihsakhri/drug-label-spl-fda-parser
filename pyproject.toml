[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-label-spl-fda-parser"
version = "2.0.0"
description = "SPL-LabelParser: FDA Structured Product Labeling & Black Box Warning"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "pydantic>=2,<3", "uvicorn>=0.20,<1"]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "spl_label_parser*"]

[project.scripts]
drug-label-spl-fda-parser = "spl_label_parser.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/drug-label-spl-fda-parser"
Repository = "https://github.com/abusuraihsakhri/drug-label-spl-fda-parser.git"
