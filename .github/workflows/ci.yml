name: Python tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[api,test]'
          python -m pip check
      - name: Python syntax and regression tests
        env:
          AUDIT_SECRET_KEY: ci-test-audit-secret-key-for-github-actions-32chars
        run: |
          python -m compileall -q agents spl_label_parser cli.py enrichment.py simulator.py
          python -m pytest -q
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
